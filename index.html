<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cerise, ton journal de calories et protéines. Un peu de suivi, beaucoup de douceur." />
    <meta name="color-scheme" content="light dark" />
    <title>Cerise · À ton rythme</title>
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
        const theme = param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Active JavaScript pour ouvrir ton journal Cerise.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
